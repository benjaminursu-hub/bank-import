name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      # Run both OSes to the end, even if one fails, so we see every failure at once.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Ubuntu runners have Docker with Linux containers, so all tests run there,
      # including the Testcontainers (PostgreSQL) tests.
      - name: Build and test (all tests)
        if: runner.os == 'Linux'
        run: ./mvnw -B verify

      # Windows runners only support Windows containers, so the postgres image cannot start.
      # Tests tagged "docker" are skipped here; everything else (parsers, duplicates) still runs.
      - name: Build and test (without Docker tests)
        if: runner.os == 'Windows'
        run: ./mvnw.cmd -B verify "-DexcludedGroups=docker"
